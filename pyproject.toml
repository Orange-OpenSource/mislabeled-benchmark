[project]
name = "mislabeled-benchmark"
version = "0.1.0"
description = "mislabeled benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biquality-learn",
    "catboost>=1.2.8",
    "filelock>=3.18.0",
    "h5py>=3.13.0",
    "matplotlib>=3.10.1",
    "mislabeled[datasets]",
    "relplot>=1.0",
    "scikit-learn<1.7.0",
    "seaborn>=0.13.2",
    "networkx",
    "jinja2",
]
[project.optional-dependencies]
cifar=[
    "torch", "torchvision"
]

[tool.uv.sources]
mislabeled = { git = "https://github.com/orange-opensource/mislabeled" }
biquality-learn = { git = "https://github.com/biquality-learn/biquality-learn" }
# scikit-learn = { git = "https://github.com/virchan/scikit-learn", branch = "issues/28574_implementing_temperature_scaling" }

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
